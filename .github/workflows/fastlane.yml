name: CI/CD

on:
  push:
    branches:
      - master
      - testflight
      - 'release/*'
  pull_request:
    branches: [master]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # Build without codesign for CI (master)
      - name: Build iOS (CI)
        if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
        run: flutter build ios --release --no-codesign

      # TestFlight Deploy (release/* or testflight branch only)
      - name: Setup Ruby
        if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/testflight'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Setup SSH for Match
        if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/testflight'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Deploy to TestFlight
        if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/testflight'
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: 'beta'
          subdirectory: 'ios'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android
        run: flutter build apk --release
