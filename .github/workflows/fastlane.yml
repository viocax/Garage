name: CI/CD

on:
  push:
    branches:
      - testflight
      - release
  pull_request:
    branches: [master]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # Build Check for PRs (master)
      - name: Build iOS (Check)
        if: github.event_name == 'pull_request'
        run: flutter build ios --release --no-codesign

      # TestFlight Deploy (testflight branch or release branch)
      - name: Setup Ruby
        if: github.event_name == 'push'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup SSH for Match
        if: github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Deploy to TestFlight
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/testflight" ]]; then
             echo "🚀 Running fastlane upload for TestFlight branch..."
             bundle exec fastlane ios upload
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
             echo "🏷️ Running fastlane release (with Tagging) for Release branch..."
             bundle exec fastlane ios release
          fi
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android
        run: flutter build apk --release
